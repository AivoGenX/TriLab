<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <link rel="shortcut icon" href="./favicon.ico" />
    <meta name="viewport" content="initial-scale=1.0, user-scalable=no, width=device-width">
    <title>宽线</title>
    <style type="text/css">
        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            overflow: hidden;
        }
    </style>
</head>

<body>
    <div id="map" style="width:100%;height: 100%"></div>
</body>
<script type="module">
    import triLab from './TriLab.js';

    let mapViewer = new triLab.Map('map', {
        yaw: 0, pitch: 0, zoom: 18, autoRotate: false,
        center: [0, 0, 0]
    });

    const graphicLayer = new triLab.layer.GraphicLayer();
    mapViewer.addLayer(graphicLayer);

    // 实体宽线
    let ps1 = [[0, 0, 0], [100, 0, 0], [100, 100, 0]];
    let Trip = new triLab.graphic.TripLine({ vertices: ps1, color: "#ff0000", width: 2 });
    graphicLayer.addGraphic(Trip);
    
    // 虚线宽线
    let ps2 = [[0, 0, 0], [100, 0, 0], [100, 100, 0]];
    let Trip2 = new triLab.graphic.TripLine({ vertices: ps2, color: "#ffff00", width: 2, lineDash: [5, 5] });
    Trip2.setPosition([0, 100, 0]);
    graphicLayer.addGraphic(Trip2);

    let Trip3 = new triLab.graphic.TripLine({ 
        vertices: ps2, 
        color: "#00ff00", 
        imgUrl: './data/line/arrow.png', 
        placeSpace: 10, 
        placeLength: 10, 
        width: 15, 
        isResolution: false 
    });
    Trip3.setPosition([0, -100, 0]);
    graphicLayer.addGraphic(Trip3);
   
</script>

</html>
