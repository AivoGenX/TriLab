<!--
 * 文件名称：PolylineGraphicGUI.html
 * 功能说明：PolylineGraphic GUI 控制示例
 * 技术栈：HTML5 + CSS3 + JavaScript (ES6 Modules)
 * 依赖库：triLab.js、three.module.js、dat.gui.min.js
 * 主要功能：
 *   1. 创建GraphicLayer图形图层
 *   2. 在图层上添加多个PolylineGraphic线图形
 *   3. 使用GUI控制线的颜色、宽度、透明度、虚线样式
 * 创建日期：2024-01-10
 * 最后修改：2026-01-19
-->
<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PolylineGraphic GUI 控制示例</title>
    <style>
      html,
      body,
      #app {
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
      }

      .info-panel {
        position: absolute;
        top: 10px;
        left: 10px;
        background: rgba(0, 0, 0, 0.7);
        color: white;
        padding: 15px;
        border-radius: 5px;
        font-family: Arial, sans-serif;
        font-size: 14px;
        max-width: 300px;
      }

      .info-panel h3 {
        margin-top: 0;
        margin-bottom: 10px;
      }

      .info-panel p {
        margin: 5px 0;
      }
    </style>
  </head>

  <body>
    <div id="app"></div>

    <div class="info-panel">
      <h3>PolylineGraphic GUI 控制示例</h3>
      <p>使用右侧GUI控制线的样式</p>
      <p id="click-info">点击线图形查看信息...</p>
    </div>

    <script src="./js/dat.gui.min.js"></script>
    <script type="module">
      // 导入所需模块（使用命名空间方式）
      import triLab from "./TriLab.js";
      import * as THREE from "./three.module.js";

      const map = new triLab.Map("app");

      const graphicLayer = new triLab.layer.GraphicLayer({
        id: "graphic-layer-001",
        name: "线图形图层",
        visible: true,
        opacity: 1.0,
        enablePick: true,
        clickRadius: 10,
      });

      map.addLayer(graphicLayer);

      const polylines = [
        {
          id: "line-001",
          code: "line-001",
          name: "线1（窄线）",
          coordinates: [
            [-5, -2, 0],
            [-2, 2, 0],
            [1, -1, 0],
            [4, 3, 0],
          ],
          symbol: {
            type: "polyline",
            color: "#ff0000",
            width: 1,
            opacity: 1.0,
            dashSize: 0,
            gapSize: 0,
          },
        },
        {
          id: "line-002",
          code: "line-002",
          name: "线2（宽线）",
          coordinates: [
            [-3, 3, 0],
            [0, 0, 0],
            [3, 3, 0],
          ],
          symbol: {
            type: "polyline",
            color: "#00ff00",
            width: 5,
            opacity: 0.8,
            dashSize: 0,
            gapSize: 0,
          },
        },
        {
          id: "line-003",
          code: "line-003",
          name: "线3（虚线）",
          coordinates: [
            [-4, -3, 0],
            [0, 0, 0],
            [4, -3, 0],
          ],
          symbol: {
            type: "polyline",
            color: "#0000ff",
            width: 2,
            opacity: 1.0,
            dashSize: 3,
            gapSize: 2,
          },
        },
        {
          id: "line-004",
          code: "line-004",
          name: "线4（宽虚线）",
          coordinates: [
            [2, -4, 3],
            [5, -1, 3],
            [2, 2, 3],
          ],
          symbol: {
            type: "polyline",
            color: "#ff00ff",
            width: 4,
            opacity: 0.6,
            dashSize: 5,
            gapSize: 3,
          },
        },
      ];

      polylines.forEach((lineData) => {
        const line = new triLab.graphic.PolylineGraphic(lineData);
        console.log("创建线:", line.code, "id:", line.id);
        graphicLayer.addGraphic(line);
      });

      console.log(
        "图层中所有图形:",
        graphicLayer.graphics.map((g) => ({ id: g.id, code: g.code }))
      );

      const line001 = graphicLayer.getGraphic("line-001");
      const line002 = graphicLayer.getGraphic("line-002");
      const line003 = graphicLayer.getGraphic("line-003");
      const line004 = graphicLayer.getGraphic("line-004");

      console.log("line001:", line001);
      console.log("line002:", line002);
      console.log("line003:", line003);
      console.log("line004:", line004);

      const initGUI = () => {
        const gui = new dat.GUI();

        const folder1 = gui.addFolder("线1（窄线）");
        folder1
          .addColor({ 颜色: line001.getSymbol().color }, "颜色")
          .onChange((val) => {
            line001.setColor(val);
          });
        folder1
          .add({ 宽度: line001.getSymbol().width }, "宽度", 0.1, 10)
          .onChange((val) => {
            line001.setWidth(val);
          });
        folder1.open();

        const folder2 = gui.addFolder("线2（宽线）");
        folder2
          .addColor({ 颜色: line002.getSymbol().color }, "颜色")
          .onChange((val) => {
            line002.setColor(val);
          });
        folder2
          .add({ 宽度: line002.getSymbol().width }, "宽度", 0.1, 10)
          .onChange((val) => {
            line002.setWidth(val);
          });
        folder2
          .add({ 透明度: line002.getSymbol().opacity }, "透明度", 0, 1)
          .onChange((val) => {
            line002.setOpacity(val);
          });
        folder2.open();

        const folder3 = gui.addFolder("线3（虚线）");
        folder3
          .addColor({ 颜色: line003.getSymbol().color }, "颜色")
          .onChange((val) => {
            line003.setColor(val);
          });
        folder3
          .add({ 宽度: line003.getSymbol().width }, "宽度", 0.1, 10)
          .onChange((val) => {
            line003.setWidth(val);
          });
        folder3
          .add(
            { 虚线段长度: line003.getSymbol().dashSize },
            "虚线段长度",
            0,
            20
          )
          .onChange((val) => {
            line003.setDashStyle(val, line003.getSymbol().gapSize);
          });
        folder3
          .add({ 间隙长度: line003.getSymbol().gapSize }, "间隙长度", 0, 20)
          .onChange((val) => {
            line003.setDashStyle(line003.getSymbol().dashSize, val);
          });
        folder3.open();

        const folder4 = gui.addFolder("线4（宽虚线）");
        folder4
          .addColor({ 颜色: line004.getSymbol().color }, "颜色")
          .onChange((val) => {
            line004.setColor(val);
          });
        folder4
          .add({ 宽度: line004.getSymbol().width }, "宽度", 0.1, 10)
          .onChange((val) => {
            line004.setWidth(val);
          });
        folder4
          .add({ 透明度: line004.getSymbol().opacity }, "透明度", 0, 1)
          .onChange((val) => {
            line004.setOpacity(val);
          });
        folder4
          .add(
            { 虚线段长度: line004.getSymbol().dashSize },
            "虚线段长度",
            0,
            20
          )
          .onChange((val) => {
            line004.setDashStyle(val, line004.getSymbol().gapSize);
          });
        folder4
          .add({ 间隙长度: line004.getSymbol().gapSize }, "间隙长度", 0, 20)
          .onChange((val) => {
            line004.setDashStyle(line004.getSymbol().dashSize, val);
          });
        folder4.open();
      };

      initGUI();

      graphicLayer.on("click", (e) => {
        const graphic = e.graphic;
        const position = graphic.position;
        const symbol = graphic.getSymbol();
        document.getElementById("click-info").innerHTML =
          "点击了: " +
          graphic.code +
          "<br>" +
          "名称: " +
          graphic.name +
          "<br>" +
          "位置: (" +
          position.x.toFixed(2) +
          ", " +
          position.y.toFixed(2) +
          ", " +
          position.z.toFixed(2) +
          ")<br>" +
          "宽度: " +
          symbol.width +
          "<br>" +
          "颜色: " +
          symbol.color +
          "<br>" +
          "透明度: " +
          symbol.opacity +
          "<br>" +
          "虚线: " +
          (symbol.dashSize > 0 ? "是" : "否");
      });

      map.setCenter([0, 0, 5]);
    </script>
  </body>
</html>
