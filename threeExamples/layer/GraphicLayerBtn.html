<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>graphicLayer加载GeoJSON及点击弹窗</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body,
      #app {
        width: 100%;
        height: 100%;
      }

      .control-panel {
        position: absolute;
        z-index: 100;
        margin: 10px;
        padding: 15px;
        background-color: rgba(255, 255, 255, 0.8);
        border-radius: 5px;
        font-family: Arial, sans-serif;
      }

      .control-panel h3 {
        margin-bottom: 15px;
        color: #333;
      }

      .control-buttons {
        margin-bottom: 15px;
      }

      .control-buttons input[type="button"] {
        margin-right: 8px;
        margin-bottom: 8px;
        padding: 6px 12px;
        border: 1px solid #ddd;
        border-radius: 4px;
        background-color: #f5f5f5;
        cursor: pointer;
      }

      .control-buttons input[type="button"]:hover {
        background-color: #e0e0e0;
      }

      .info-text {
        color: #666;
        font-size: 14px;
        line-height: 1.4;
      }

      .log-panel {
        position: absolute;
        bottom: 10px;
        right: 10px;
        z-index: 100;
        width: 300px;
        height: 200px;
        padding: 10px;
        background-color: rgba(0, 0, 0, 0.7);
        color: #fff;
        border-radius: 5px;
        font-family: Arial, sans-serif;
        font-size: 12px;
        overflow-y: auto;
      }

      .log-panel h4 {
        margin-bottom: 10px;
        color: #fff;
      }

      .log-message {
        margin-bottom: 5px;
        line-height: 1.3;
      }
    </style>
    <link rel="stylesheet" type="text/css" href="./css/TriLab.css" />
  </head>
  <body>
    <!-- 控制面板 -->
    <div class="control-panel">
      <h3>GeoJSON 加载示例</h3>
      <div class="control-buttons">
        <input type="button" id="loadGeoJSON" value="加载 GeoJSON 数据" />
        <input type="button" id="clearGraphics" value="清除所有图形" />
        <input type="button" id="locateLayer" value="定位到图层" />
      </div>
      <div class="info-text">
        [点击 "加载 GeoJSON 数据" 按钮加载示例数据]<br />
        [示例数据包含一个点和一条线]<br />
        [图形会根据 GeoJSON 数据的几何类型自动创建]
      </div>
    </div>

    <!-- 日志面板 -->
    <div class="log-panel">
      <h4>控制台日志</h4>
      <div id="logContent" class="log-messages"></div>
    </div>

    <!-- 3D 视图容器 -->
    <div id="app"></div>

    <script type="module">
      import triLab from "./TriLab.js";
      import * as THREE from "./three.module.js";

      // 全局日志函数
      function log(message) {
        console.log(message);
        const logContent = document.getElementById("logContent");
        const logMessage = document.createElement("div");
        logMessage.className = "log-message";
        logMessage.textContent = message;
        logContent.appendChild(logMessage);
        logContent.scrollTop = logContent.scrollHeight;
      }

      // 初始化地图
      const map = new triLab.Map("app");
      log("地图初始化完成");

      // 加载点云数据作为背景
      const pointcloud = new triLab.layer.PointCloudLayer();
      map.addLayer(pointcloud);
      log("点云图层添加完成");

      pointcloud.addClouds(["./data/text.lab"]).then(() => {
        map.fitToScreen();
        log("点云数据加载完成");
      });

      // 初始化图形图层
      const graphicLayer = new triLab.layer.GraphicLayer({
        id: "geojson-layer",
        name: "GeoJSON 图层",
        visible: true,
        opacity: 1.0,
        enablePick: true,
        clickRadius: 10,
      });
      map.addLayer(graphicLayer);
      log("图形图层添加完成");

      // GeoJSON 数据
      const geoJSONData = {
        type: "FeatureCollection",
        features: [
          {
            type: "Feature",
            geometry: {
              type: "Point",
              coordinates: [0, 0, 0],
            },
            properties: {
              name: "测试点",
              color: "#ff0000",
              size: 15,
            },
          },
          {
            type: "Feature",
            geometry: {
              type: "LineString",
              coordinates: [
                [-1, -1, 0],
                [1, 1, 0],
              ],
            },
            properties: {
              name: "测试线",
              color: "#00ff00",
              width: 3,
            },
          },
        ],
      };

      // 加载 GeoJSON 数据按钮点击事件
      document.getElementById("loadGeoJSON").addEventListener("click", () => {
        log("开始加载 GeoJSON 数据...");

        // 加载 GeoJSON 数据
        const graphics = graphicLayer.loadGeoJSON(geoJSONData);
        log(`创建了 ${graphics.length} 个图形对象`);

        graphics.forEach((graphic, index) => {
          log(`图形 ${index + 1}: ${graphic.type} - ${graphic.name}`);
        });
      });

      // 清除所有图形按钮点击事件
      document.getElementById("clearGraphics").addEventListener("click", () => {
        graphicLayer.clear();
        log("所有图形已清除");
      });

      // 定位到图层按钮点击事件
      document.getElementById("locateLayer").addEventListener("click", () => {
        graphicLayer.locateLayer();
        log("已定位到图层");
      });

      // 为图形添加点击事件监听
      graphicLayer.on("click", (event) => {
        if (event.graphic) {
          log(`点击了图形: ${event.graphic.type} - ${event.graphic.name}`);

          // 确保图形对象有 popup 属性
          if (!event.graphic.popup) {
            event.graphic.popup = `
            <div style="padding: 12px; font-family: Arial, sans-serif;">
              <h5 style="margin-top: 0; margin-bottom: 10px; color: #333;">图形信息</h5>
              <div style="margin-bottom: 10px; line-height: 1.4;">
                <p style="margin: 5px 0;"><strong>名称:</strong> ${event.graphic.name || "未命名图形"}</p>
                <p style="margin: 5px 0;"><strong>类型:</strong> ${event.graphic.type || "未知类型"}</p>
                <p style="margin: 5px 0;"><strong>坐标:</strong> (${event.graphic.position.x.toFixed(2)}, ${event.graphic.position.y.toFixed(2)}, ${event.graphic.position.z.toFixed(2)})</p>
              </div>
              <div style="text-align: center; margin-top: 10px;">
                <button onclick="alert('图形弹窗按钮被点击！')" style="padding: 6px 12px; border: 1px solid #ddd; border-radius: 4px; background-color: #f5f5f5; cursor: pointer;">默认按钮</button>
              </div>
            </div>
          `;
          
          }

          event.graphic.openPopup();
        }
      });
    </script>
  </body>
</html>
