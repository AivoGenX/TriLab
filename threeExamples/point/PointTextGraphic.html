<!--
 * 文件名称：GraphicPointTextGraphic.html
 * 功能说明：PointTextGraphic 点文本图形的使用示例
 * 技术栈：HTML5 + CSS3 + JavaScript (ES6 Modules)
 * 依赖库：triLab.js、three.module.js
 * 主要功能：
 *   1. 创建GraphicLayer图形图层
 *   2. 在图层上添加带文本的PointTextGraphic点图形
 *   3. 点文本图形的显示/隐藏、删除、定位控制
 *   4. 动态添加新的点文本图形
 *   5. 点击事件监听
 *   6. 图层定位和缩放控制
 * 创建日期：2024-01-10
 * 最后修改：2026-01-17
-->
<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <!-- 字符编码：UTF-8 -->
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <!-- IE浏览器兼容模式 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- 移动端适配 -->
    <title>PointTextGraphic 示例</title>
    <style>
      /* 基础样式：确保地图容器占满整个屏幕 */
      html,
      body,
      #app {
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
      }

      /* 信息面板样式 */
      .info-panel {
        position: absolute; /* 绝对定位 */
        top: 10px; /* 距离顶部10px */
        left: 10px; /* 距离左侧10px */
        background: rgba(0, 0, 0, 0.7); /* 半透明黑色背景 */
        color: white; /* 文本颜色 */
        padding: 15px; /* 内边距 */
        border-radius: 5px; /* 圆角 */
        font-family: Arial, sans-serif; /* 字体 */
        font-size: 14px; /* 字体大小 */
        max-width: 350px; /* 最大宽度：比之前示例稍宽，因为需要显示更多信息 */
      }

      /* 信息面板标题样式 */
      .info-panel h3 {
        margin-top: 0; /* 顶部外边距为0 */
        margin-bottom: 10px; /* 底部外边距 */
      }

      /* 信息面板段落样式 */
      .info-panel p {
        margin: 5px 0; /* 上下外边距 */
      }

      /* 控制按钮容器样式 */
      .control-buttons {
        margin-top: 10px; /* 顶部外边距 */
        display: flex; /* 弹性布局 */
        gap: 5px; /* 按钮间距 */
        flex-wrap: wrap; /* 允许按钮换行 */
      }

      /* 控制按钮基础样式 */
      .control-buttons button {
        padding: 5px 10px; /* 内边距 */
        background: #4caf50; /* 背景色：绿色 */
        color: white; /* 文本颜色 */
        border: none; /* 无边框 */
        border-radius: 3px; /* 圆角 */
        cursor: pointer; /* 鼠标指针为手型 */
        font-size: 12px; /* 字体大小 */
      }

      /* 控制按钮悬停样式 */
      .control-buttons button:hover {
        background: #45a049; /* 悬停时背景色 */
      }

      /* 控制按钮点击样式 */
      .control-buttons button:active {
        background: #3d8b40; /* 点击时背景色 */
      }

      /* 图形控制区域样式 */
      .graphic-controls {
        margin-top: 15px; /* 顶部外边距 */
        padding-top: 10px; /* 顶部内边距 */
        border-top: 1px solid rgba(255, 255, 255, 0.3); /* 顶部边框 */
      }

      /* 图形控制标题样式 */
      .graphic-controls h4 {
        margin: 0 0 10px 0; /* 外边距 */
        font-size: 12px; /* 字体大小 */
        color: #ccc; /* 文本颜色：浅灰色 */
      }

      /* 图形控制按钮容器样式 */
      #graphic-buttons {
        display: flex; /* 弹性布局 */
        flex-direction: column; /* 垂直排列 */
        gap: 5px; /* 按钮间距 */
      }

      /* 单个图形控制按钮容器样式 */
      .graphic-button {
        display: flex; /* 弹性布局 */
        align-items: center; /* 垂直居中 */
        gap: 5px; /* 元素间距 */
        padding: 5px; /* 内边距 */
        background: rgba(255, 255, 255, 0.1); /* 半透明白色背景 */
        border-radius: 3px; /* 圆角 */
      }

      /* 图形控制按钮文本样式 */
      .graphic-button span {
        flex: 1; /* 占据剩余空间 */
        font-size: 12px; /* 字体大小 */
        white-space: nowrap; /* 不换行 */
        overflow: hidden; /* 超出部分隐藏 */
        text-overflow: ellipsis; /* 超出部分显示省略号 */
      }

      /* 图形控制按钮基础样式 */
      .graphic-button button {
        padding: 3px 8px; /* 内边距 */
        background: #2196f3; /* 背景色：蓝色 */
        color: white; /* 文本颜色 */
        border: none; /* 无边框 */
        border-radius: 3px; /* 圆角 */
        cursor: pointer; /* 鼠标指针为手型 */
        font-size: 11px; /* 字体大小 */
      }

      /* 图形控制按钮悬停样式 */
      .graphic-button button:hover {
        background: #0b7dda; /* 悬停时背景色 */
      }

      /* 隐藏按钮样式 */
      .graphic-button button.hidden {
        background: #f44336; /* 背景色：红色 */
      }

      /* 隐藏按钮悬停样式 */
      .graphic-button button.hidden:hover {
        background: #da190b; /* 悬停时背景色 */
      }

      /* 删除按钮样式 */
      .graphic-button button.delete {
        background: #f44336; /* 背景色：红色 */
      }

      /* 删除按钮悬停样式 */
      .graphic-button button.delete:hover {
        background: #da190b; /* 悬停时背景色 */
      }

      /* 定位按钮样式 */
      .graphic-button button.locate {
        background: #ff9800; /* 背景色：橙色 */
      }

      /* 定位按钮悬停样式 */
      .graphic-button button.locate:hover {
        background: #f57c00; /* 悬停时背景色 */
      }
    </style>
  </head>

  <body>
    <!-- 地图容器：triLab地图将渲染到这个div中 -->
    <div id="app"></div>

    <!-- 信息面板：显示操作说明和控制按钮 -->
    <div class="info-panel">
      <!-- 面板标题 -->
      <h3>PointTextGraphic 示例</h3>

      <!-- 操作说明 -->
      <p>点击点文本图形查看信息</p>

      <!-- 点击信息显示区域：显示当前点击的点文本图形信息 -->
      <p id="click-info">点击点文本图形...</p>

      <!-- 控制按钮组：用于控制整个图层和添加新图形 -->
      <div class="control-buttons">
        <button id="show-layer">显示图层</button>
        <!-- 显示图层按钮 -->
        <button id="hide-layer">隐藏图层</button>
        <!-- 隐藏图层按钮 -->
        <button id="toggle-layer">切换图层</button>
        <!-- 切换图层显示状态按钮 -->
        <button id="zoom-to-layer" style="background: #ff5722">图层定位</button>
        <!-- 图层定位按钮：橙色 -->
        <button id="add-point-text" style="background: #2196f3">
          新增点文本
        </button>
        <!-- 新增点文本按钮：蓝色 -->
        <button id="clear-graphics" style="background: #f44336">
          清空所有
        </button>
        <!-- 清空所有图形按钮：红色 -->
      </div>

      <!-- 单个图形控制区域 -->
      <div class="graphic-controls">
        <h4>控制点文本图形</h4>
        <!-- 动态生成的单个图形控制按钮容器 -->
        <div id="graphic-buttons"></div>
      </div>
    </div>
    <script type="module">
      // 导入所需模块
      // 导入所需模块（使用命名空间方式）
      import triLab from "./TriLab.js"; // 导入triLab命名空间
      import * as THREE from "./three.module.js"; // 导入Three.js库（用于3D渲染）

      // 初始化地图：创建triLab实例，绑定到id为"app"的DOM元素
      const map = new triLab.Map("app");

      // 创建GraphicLayer图形图层
      const graphicLayer = new triLab.layer.GraphicLayer({
        id: "point-text-graphic-layer-001", // 图层唯一标识
        name: "点文本图形图层", // 图层名称
        visible: true, // 初始可见性
        opacity: 1.0, // 透明度
        enablePick: true, // 启用拾取功能
        clickRadius: 20, // 点击检测半径
      });

      // 将图形图层添加到地图
      map.addLayer(graphicLayer);

      // 定义点文本图形数据
      const pointTexts = [
        {
          code: "pt-001", // 点文本标识
          name: "点文本1", // 点文本名称
          position: [0, 0, 0], // 点位置：[x, y, z]
          symbol: {
            type: "pointText", // 符号类型：点文本
            pointStyle: {
              size: 50, // 点大小
              color: 0xff0000, // 点颜色：红色（十六进制）
              url: "./data/imgs/bus.png", // 点图标URL
            },
            textStyle: {
              text: "公交站点", // 显示文本
              fontsize: 30, // 字体大小
              textColor: { r: 255, g: 255, b: 255, a: 1.0 }, // 文本颜色：白色（RGBA格式）
              backgroundColor: { r: 0, g: 128, b: 255, a: 0.8 }, // 背景颜色：蓝色（RGBA格式）
              borderColor: { r: 0, g: 0, b: 0, a: 1.0 }, // 边框颜色：黑色（RGBA格式）
              borderThickness: 1, // 边框厚度
              sizeAttenuation: false, // 禁用大小衰减（保持文本大小不随距离变化）
              scaleXYZ: 0.001, // 缩放比例
              offsetY: 60, // Y轴偏移量（文本相对于点的位置）
            },
          },
        },
        {
          code: "pt-002", // 点文本标识
          name: "点文本2", // 点文本名称
          position: [2, 2, 0], // 点位置：[x, y, z]
          symbol: {
            type: "pointText", // 符号类型：点文本
            pointStyle: {
              size: 20, // 点大小
              color: 0x00ff00, // 点颜色：绿色（十六进制）
              url: "./data/imgs/bus.png", // 点图标URL
            },
            textStyle: {
              text: "地标建筑", // 显示文本
              fontsize: 20, // 字体大小
              textColor: "#FFFFFF", // 文本颜色：白色（十六进制字符串格式）
              // textColor: { r: 0, g: 0, b: 0, a: .3 }, // 可选的文本颜色设置（当前被注释）
              backgroundColor: { r: 0, g: 0, b: 0, a: 0.0 }, // 背景颜色：透明（RGBA格式）
              borderColor: { r: 0, g: 0, b: 0, a: 0.0 }, // 边框颜色：透明（RGBA格式）
              borderThickness: 0, // 无边框
              sizeAttenuation: false, // 禁用大小衰减
              scaleXYZ: 0.0015, // 缩放比例
              offsetY: 35, // Y轴偏移量
            },
          },
        },
      ];

      // 创建并添加点文本图形到图层
      pointTexts.forEach((ptData) => {
        const pointTextGraphic = new triLab.graphic.PointTextGraphic({
          position: ptData.position, // 设置位置
          // geometry: { type: 'Point', coordinates: ptData.position }, // 可选的几何体设置（当前被注释）
          symbol: ptData.symbol, // 设置符号样式
          code: ptData.code, // 设置标识
          name: ptData.name, // 设置名称
        });
        console.log(
          "创建点文本图形:" +
            pointTextGraphic.code +
            ", " +
            pointTextGraphic.position,
        );
        graphicLayer.addGraphic(pointTextGraphic); // 将点文本图形添加到图层
      });

      // 监听图形图层的点击事件
      graphicLayer.on("click", (e) => {
        const graphic = e.graphic; // 获取点击的点文本图形
        const position = graphic.position; // 获取点位置
        const symbol = graphic.getSymbol(); // 获取符号样式
        // 更新点击信息显示（替换模板字符串为拼接）
        document.getElementById("click-info").innerHTML =
          "点击了: " +
          graphic.code +
          "<br>" +
          "名称: " +
          graphic.name +
          "<br>" +
          "位置: (" +
          position.x.toFixed(2) +
          ", " +
          position.y.toFixed(2) +
          ", " +
          position.z.toFixed(2) +
          ")<br>" +
          "点大小: " +
          (symbol.point ? symbol.point.size : "") +
          "<br>" +
          "文本: " +
          (symbol.text ? symbol.text.text : "") +
          "<br>" +
          "字体大小: " +
          (symbol.text ? symbol.text.fontsize : "");
      });

      // 监听图形图层的悬停事件
      graphicLayer.on("hover", (e) => {
        const graphic = e.graphic;
        console.log("悬停:" + graphic.code);
      });

      // 控制图层显示和隐藏的按钮事件
      // 显示图层按钮事件
      document.getElementById("show-layer").addEventListener("click", () => {
        graphicLayer.show(); // 调用show方法显示图层
        console.log("显示图层");
      });

      // 隐藏图层按钮事件
      document.getElementById("hide-layer").addEventListener("click", () => {
        graphicLayer.hide(); // 调用hide方法隐藏图层
        console.log("隐藏图层");
      });

      // 切换图层显示状态按钮事件
      document.getElementById("toggle-layer").addEventListener("click", () => {
        graphicLayer.visible = !graphicLayer.visible; // 直接修改visible属性切换图层可见性
        console.log("切换图层:" + (graphicLayer.visible ? "显示" : "隐藏"));
      });

      // 清空所有点文本图形按钮事件
      document
        .getElementById("clear-graphics")
        .addEventListener("click", () => {
          if (confirm("确定要清空所有点文本图形吗？")) {
            // 确认对话框
            graphicLayer.clear(); // 调用clear方法清空图层上所有图形
            document.getElementById("graphic-buttons").innerHTML = "";
            console.log("清空所有点文本图形");
          }
        });

      // 图层定位按钮事件处理
      document.getElementById("zoom-to-layer").addEventListener("click", () => {
        console.log("调用图层定位方法");
        graphicLayer.locateLayer(); // 调用locateLayer方法定位到图层范围
      });

      // 设置地图初始中心点
      map.setCenter([0, 0, 2]);

      // 新增点文本计数器
      let newPointTextCount = 1;

      // 新增点文本按钮点击事件
      document
        .getElementById("add-point-text")
        .addEventListener("click", () => {
          // 生成随机位置（在中心附近）
          const randomX = (Math.random() - 0.5) * 10;
          const randomY = (Math.random() - 0.5) * 10;
          const position = [randomX, randomY, 0];

          // 生成随机颜色
          const randomColor = Math.floor(Math.random() * 0xffffff);

          // 先自增计数器（保持原逻辑）
          const currentCount = newPointTextCount++;
          // 创建新的点文本数据（替换模板字符串）
          const newPointTextData = {
            code: "pt-new-" + currentCount, // 生成新的点文本标识
            name: "新点文本-" + newPointTextCount, // 生成新的点文本名称
            position: position, // 设置位置
            symbol: {
              type: "pointText", // 符号类型：点文本
              pointStyle: {
                size: 50, // 点大小
                color: randomColor, // 随机点颜色
                url: "./data/imgs/bus.png", // 点图标URL
              },
              textStyle: {
                text: "新文本-" + newPointTextCount, // 显示文本
                fontsize: 20 + Math.floor(Math.random() * 10), // 随机字体大小（20-29）
                textColor: { r: 255, g: 255, b: 255, a: 1.0 }, // 文本颜色：白色
                backgroundColor: {
                  r: Math.floor(randomColor / 65536), // 随机背景颜色的R分量
                  g: Math.floor((randomColor % 65536) / 256), // 随机背景颜色的G分量
                  b: randomColor % 256, // 随机背景颜色的B分量
                  a: 0.8, // 背景透明度
                },
                borderColor: { r: 0, g: 0, b: 0, a: 1.0 }, // 边框颜色：黑色
                borderThickness: 1, // 边框厚度
                sizeAttenuation: false, // 禁用大小衰减
                scaleXYZ: 0.001, // 缩放比例
                offsetY: 30, // Y轴偏移量
              },
            },
          };

          // 创建新的 PointTextGraphic 实例
          const newPointTextGraphic = new triLab.graphic.PointTextGraphic({
            position: newPointTextData.position, // 设置位置
            symbol: newPointTextData.symbol, // 设置符号样式
            code: newPointTextData.code, // 设置标识
            name: newPointTextData.name, // 设置名称
          });

          // 将新创建的点文本图形添加到图层
          graphicLayer.addGraphic(newPointTextGraphic);
          console.log(
            "新增点文本图形:" +
              newPointTextGraphic.code +
              ", " +
              newPointTextGraphic.position,
          );

          // 为新创建的点文本添加控制按钮
          createGraphicControlButtons(newPointTextGraphic);
        });

      // 创建图形控制按钮的可重用函数
      function createGraphicControlButtons(graphic) {
        const graphicButtonsContainer =
          document.getElementById("graphic-buttons"); // 获取按钮容器
        const buttonContainer = document.createElement("div"); // 创建按钮容器元素
        buttonContainer.className = "graphic-button"; // 设置容器样式类
        // 使用正确的图形ID：优先使用uuid，如果没有则使用id
        const graphicId = graphic.uuid || graphic.id;
        buttonContainer.id = "graphic-control-" + graphicId; // 设置容器ID

        // 创建图形标签
        const label = document.createElement("span");
        label.textContent = graphic.name + " (" + graphic.code + ")";

        // 创建显示/隐藏按钮
        const toggleButton = document.createElement("button");
        toggleButton.textContent = "隐藏";
        toggleButton.addEventListener("click", () => {
          if (graphic.visible) {
            graphic.hide(); // 隐藏图形
          } else {
            graphic.show(); // 显示图形
          }
          // 更新按钮文本和样式
          toggleButton.textContent = graphic.visible ? "隐藏" : "显示";
          toggleButton.classList.toggle("hidden", !graphic.visible);
          console.log(
            graphic.name +
              " (" +
              graphic.code +
              "): " +
              (graphic.visible ? "显示" : "隐藏"),
          );
        });

        // 创建删除按钮
        const deleteButton = document.createElement("button");
        deleteButton.textContent = "删除";
        deleteButton.className = "delete";
        deleteButton.addEventListener("click", () => {
          if (
            confirm(
              "确定要删除 " + graphic.name + " (" + graphic.code + ") 吗？",
            )
          ) {
            // 使用正确的图形ID：优先使用uuid，如果没有则使用id
            const graphicId = graphic.uuid || graphic.id;
            graphicLayer.removeGraphic(graphicId); // 从图层移除图形
            buttonContainer.remove(); // 移除按钮容器
            console.log(
              "删除点文本图形: " + graphic.name + " (" + graphic.code + ")",
            );
          }
        });

        // 创建图层定位按钮
        const locateButton = document.createElement("button");
        locateButton.textContent = "定位";
        locateButton.className = "locate";
        locateButton.addEventListener("click", () => {
          console.log(
            "定位到点文本图形: " + graphic.name + " (" + graphic.code + ")",
          );
          // 使用正确的图形ID：优先使用uuid，如果没有则使用id
          const graphicId = graphic.uuid || graphic.id;
          graphicLayer.locateGraphicByUuid(graphicId); // 调用图层的定位方法
        });

        // 创建地图定位按钮
        const mapLocateButton = document.createElement("button");
        mapLocateButton.textContent = "map定位";
        mapLocateButton.className = "locate";
        mapLocateButton.style.background = "#9C27B0"; // 使用紫色区分
        mapLocateButton.addEventListener("click", () => {
          console.log(
            "使用map定位到点文本图形: " +
              graphic.name +
              " (" +
              graphic.code +
              ")",
          );
          // 使用map的flyTo方法进行定位：参数依次为相机位置、目标位置、选项对象
          const position = [
            graphic.position.x,
            graphic.position.y,
            graphic.position.z + 50,
          ]; // 相机位置在目标上方50单位
          const target = [
            graphic.position.x,
            graphic.position.y,
            graphic.position.z,
          ]; // 目标位置
          map.flyTo(position, target, { duration: 1000 });
        });

        // 将元素添加到按钮容器
        buttonContainer.appendChild(label);
        buttonContainer.appendChild(toggleButton);
        buttonContainer.appendChild(deleteButton);
        buttonContainer.appendChild(locateButton);
        buttonContainer.appendChild(mapLocateButton);
        // 将按钮容器添加到界面
        graphicButtonsContainer.appendChild(buttonContainer);
      }

      // 为初始点文本创建控制按钮
      graphicLayer.graphics.forEach((graphic) => {
        createGraphicControlButtons(graphic);
      });
    </script>
  </body>
</html>
